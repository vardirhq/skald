name: Release

# Tag-driven releases. The tag is the trigger, but `tools/release.mjs check` is the
# gate: package.json, package-lock.json, and CHANGELOG.md must all agree with the tag
# before anything is built or published.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release. Leave empty to release the version currently on main, creating the tag if it does not exist yet.'
        required: false
        type: string
      draft:
        description: 'Publish as a draft instead of a public release'
        type: boolean
        default: false
      allow_unmerged:
        description: 'Allow a tag that is not on main (hotfix branches)'
        type: boolean
        default: false
      replace_existing:
        description: 'Overwrite a release that is already published for this tag'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag, version, and changelog
    runs-on: ubuntu-latest
    permissions:
      # Needed only to create the tag on a manual run that does not have one yet.
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A tag push verifies that tag's own commit. A manual run starts from main
          # so the tag can be created here, after the checks pass.
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve the release commit
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = 'push' ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="v${INPUT_TAG#v}"
          else
            # The usual case straight after a release PR merges: release whatever
            # version main is now sitting on.
            TAG="v$(node tools/release.mjs version)"
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout --detach "$TAG"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; verifying the commit it points at."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$TAG does not exist yet; it will be created from main once the checks pass."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check release metadata
        id: check
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: node tools/release.mjs check --tag "$TAG"

      - name: Require the tag to be on main
        if: ${{ !inputs.allow_unmerged }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG ($SHA) is not an ancestor of main. Merge the release commit first, or re-run with allow_unmerged." >&2
            exit 1
          fi
          echo "$TAG is on main at $SHA."

      - name: Require the release to be unpublished
        if: ${{ !inputs.replace_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          STATE="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo 'absent')"
          if [ "$STATE" = "false" ]; then
            echo "::error::A published release already exists for $TAG. Re-run with replace_existing to overwrite it." >&2
            exit 1
          fi
          echo "No published release for $TAG (state: $STATE)."

      - name: Extract release notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: node tools/release.mjs notes --version "$VERSION" --out release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

      # Last, so the tag only ever appears once everything above has passed. A tag
      # pushed here cannot re-trigger this workflow, which is exactly why the rest of
      # the run continues in the same job graph rather than waiting for the push.
      - name: Create the tag
        if: steps.resolve.outputs.exists == 'false'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Skald $VERSION"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG at $(git rev-parse HEAD)."

  build:
    name: Build Linux ${{ matrix.arch }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        arch: [x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build renderer and Electron entrypoints
        run: npm run build

      - name: Package Linux artifacts
        run: npx electron-builder --linux AppImage deb --${{ matrix.arch }} --publish never

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: skald-${{ needs.verify.outputs.version }}-linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - uses: actions/download-artifact@v4
        with:
          pattern: skald-*-linux-*
          path: dist
          merge-multiple: true

      - name: Build release body
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          # Written from inside dist/ so the file names in it are unqualified and
          # `sha256sum -c SHA256SUMS.txt` works next to the downloaded artifacts.
          (cd dist && sha256sum -- *.AppImage *.deb > SHA256SUMS.txt)

          {
            cat notes/release-notes.md
            echo
            echo '## Install'
            echo
            echo '**AppImage** — `chmod +x Skald-*.AppImage` then run it.'
            echo
            echo '**Debian / Ubuntu** — `sudo apt install ./skald_*_amd64.deb`'
            echo
            echo '## Checksums'
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Artifacts carry a [build provenance attestation](https://github.com/vardirhq/skald/attestations); verify with \`gh attestation verify <file> --repo vardirhq/skald\`."
            echo
            echo "**Full changelog**: https://github.com/vardirhq/skald/blob/$TAG/CHANGELOG.md"
          } > body.md

          cat body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Skald ${{ needs.verify.outputs.version }}
          body_path: body.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt
